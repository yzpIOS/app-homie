name: app
description: A new Flutter application.

publish_to: 'none'

version: 1.7.2+100000073 #1.0.0+1_01_01_0001

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Flutter 核心框架
  flutter:
    sdk: flutter
  # Flutter 国际化支持
  flutter_localizations:
    sdk: flutter

  # UI 组件
  cupertino_icons: ^1.0.5  # iOS风格图标
  jovial_svg: ^1.1.10     # SVG图片处理
  wechat_assets_picker:   # 图片选择器
    path: ./plugin/wechat_assets_picker-8.8.0
  pay_plugin:            # 支付插件
    path: ./plugin/pay_plugin
  package_info_plus: ^4.0.2  # 获取应用包信息
  connectivity_plus: ^4.0.0  # 网络状态检测
  android_intent_plus: ^4.0.0  # Android Intent 处理
  share_plus: ^7.0.0  # 分享功能
  carousel_slider: ^4.1.1  # 轮播图组件
  event_bus: ^2.0.0  # 事件总线
  provider: ^6.0.3  # 状态管理
  dio: ^5.0.0  # 网络请求
  cached_network_image: ^3.3.0  # 网络图片缓存
  oktoast: ^3.2.0  # Toast提示
  styled_text: ^7.0.0  # 富文本
  get:  # GetX框架，用于状态管理、路由等
    path: ./plugin/getx
  hive_flutter: ^1.1.0  # 本地数据存储
  crypto: ^3.0.2  # 加密
  permission_handler: 10.4.3  # 权限处理
  url_launcher: ^6.1.8  # URL启动器
  blurhash_dart: ^1.2.0  # 图片模糊哈希
  octo_image: ^2.0.0  # 图片加载
  characters: ^1.2.0  # 字符处理
  scrollable_positioned_list: ^0.3.2  # 可定位列表
  badges: ^3.0.2  # 徽章
  visibility_detector: ^0.4.0+2  # 可见性检测
  timing: ^1.0.1  # 时间处理
  worker_manager: ^5.0.0  # 工作管理器
  boxy: ^2.0.5+1  # 布局工具
  assorted_layout_widgets: ^8.0.0  # 布局组件
  infinite_scroll_pagination: ^3.2.0  # 无限滚动分页
  sliver_tools: ^0.2.6  # Sliver工具
  flutter_layout_grid: ^2.0.1  # 网格布局
  jiffy: ^6.1.0  # 日期时间处理
  dartz: ^0.10.1  # 函数式编程
  webview_flutter: ^4.0.6  # WebView
  kotlin_flavor: ^0.2.0  # Kotlin风格
  number_display: ^3.0.0  # 数字显示
  flutter_spinkit: ^5.1.0  # 加载动画
  flutter_keyboard_visibility: ^5.3.0  # 键盘可见性
  path_provider: ^2.0.11  # 文件路径管理
  path: ^1.8.1  # 路径处理
  extended_text: ^11.0.1  # 扩展文本
  extended_text_field: ^12.0.1  # 扩展文本输入框
  extended_nested_scroll_view: ^6.1.2  # 嵌套滚动
  photo_view: ^0.14.0  # 图片查看
  freezed_annotation: ^2.4.1  # 代码生成注解
  json_annotation: ^4.8.1  # JSON序列化注解

  # 腾讯云服务
  tencent_cloud_chat_sdk: ^5.0.8  # 腾讯云IM
  tencent_trtc_cloud: ^2.4.2  # 腾讯实时音视频
  slugid: ^1.1.1  # ID生成
  bubble: ^1.2.1  # 聊天气泡
  image_size_getter: ^2.1.2  # 图片尺寸获取
  video_compress: ^3.1.1  # 视频压缩
  ffmpeg_kit_flutter: ^5.1.0  # 视频处理
  flutter_slidable: 0.6.0  # 滑动操作

  # 媒体相关
  svgaplayer_flutter: ^2.2.0  # SVG动画播放
  just_audio: ^0.9.30  # 音频播放
  record: ^4.4.3  # 录音
  flutter_portal: ^1.1.3  # 门户组件
  keframe: ^3.0.0  # 帧率优化
  chinese_font_library: ^1.0.0  # 中文字体

  # 工具类
  fnv: ^1.0.1  # 哈希函数
  percent_indicator: ^4.2.2  # 进度指示器
  flutter_animate: ^4.1.0  # 动画效果  
  synchronized: ^3.0.1  # 同步锁
  f_unity:  # Unity集成
    path: ./plugin/f_unity
  image_editor: ^1.3.0  # 图片编辑
  link_kit: ^1.0.1  # 链接处理
  alipay_kit: ^5.0.0  # 支付宝
  wechat_kit: ^5.0.3  # 微信
  smooth_page_indicator: ^1.0.1  # 页面指示器
  http_proxy: ^1.2.1  # HTTP代理
  figma_squircle: ^0.5.3  # 圆角处理
  flutter_displaymode: ^0.6.0  # 显示模式
  stack_trace: ^1.11.0  # 堆栈跟踪
  flutter_local_notifications: ^14.1.0  # 本地通知

  # 媒体播放
  media_kit: ^1.1.5  # 媒体播放
  media_kit_native_event_loop: ^1.0.4  # 媒体事件循环
  media_kit_video: ^1.1.6  # 视频播放
  media_kit_libs_ios_video: ^1.1.3  # iOS视频库

  # 布局相关
  flutter_constraintlayout: ^1.7.0-stable  # 约束布局
  wakelock:  # 屏幕常亮
    path: ./plugin/wakelock-0.6.2

  # 协议相关
  protoc_plugin: ^20.0.1  # Protocol Buffers

  # 第三方登录
  tencent_kit: ^6.0.1  # 腾讯登录

  # 支付相关
  in_app_purchase: ^3.1.7  # 苹果内购
  device_info_plus: ^9.1.1  # 设备信息
  city_pickers: ^1.3.0  # 城市选择器
  image_cropper: ^4.0.1  # 图片裁剪
  openinstall_flutter_plugin: ^2.4.2  # 安装来源统计
  flutter_blurhash: ^0.8.2  # 图片模糊哈希

  # 其他
  oaid:
    path: ./plugin/oaid
  image_pixels: ^3.0.1  # 图片像素处理
  pull_to_refresh: ^2.0.0  # 下拉刷新
  custom_sliding_segmented_control: ^1.8.3  # 分段控制器

# 配置
link_kit:
  deep_link: homie:///

wechat_kit:
  app_id: ""
  universal_link: ""
  ios: no_pay

tencent_kit:
  app_id: ""
  universal_link: ""

alipay_kit:
  scheme: ""
  ios: "noutdid"
  android: "noutdid"

# 开发依赖
dev_dependencies:
  flutter_launcher_icons: ^0.13.0  # 应用图标生成
  flutter_lints: ^2.0.0  # 代码规范
  dart_code_metrics: ^5.0.0  # 代码质量检查
  build_runner: ^2.3.3  # 代码生成
  hive_generator: ^2.0.0  # Hive代码生成
  freezed: ^2.1.0+1  # 代码生成
  json_serializable: ^6.5.0  # JSON序列化
  marqueer: ^1.4.3  # 跑马灯

# 依赖覆盖
dependency_overrides:
  alipay_kit_android:
    path: ./plugin/alipay_kit_android-5.0.0
  photo_manager:
    path: ./plugin/photo_manager-2.8.1
  extended_image:
