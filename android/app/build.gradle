def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.jm.homie.app"
    compileSdkVersion 33

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

//    packagingOptions {
//        //声网
//        exclude 'lib/arm*/*_extension.so'
//        exclude 'assets/flutter_assets/agora_rtc_engine/'
//    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        def yyMMddHHmm = new Date().format('yyMMddHHmm')
        def appName =
                project.hasProperty('app_name_override')
                        ? app_name_override
                        : (project.hasProperty('app_name') ? app_name : 'App')

        applicationId 'com.jm.homie.app'

        minSdkVersion 24
        targetSdkVersion 28
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        manifestPlaceholders += [
                app_name: appName,
                OPENINSTALL_APPKEY : "xgf2vh",
        ]

        buildConfigField 'String', 'BUILD_INFO', project.hasProperty('build_info') ? build_info : '""'

        if (project.hasProperty('armv7')) {
            versionCode versionCode + 2000

            ndk {
                //noinspection ChromeOsAbiSupport
                abiFilters 'armeabi-v7a'
            }
        }

        if (project.hasProperty('is_debug') && (is_debug == true || is_debug == 'true')) {
            applicationIdSuffix = '.debug'
        }

        if (localProperties.getProperty('flutter.buildMode') == 'release') {
            archivesBaseName = "$appName-$flutterVersionName-$yyMMddHHmm"
        }
    }

    signingConfigs {
        release {
            storeFile file('key')
            storePassword '123456'
            keyAlias 'key0'
            keyPassword '123456'

            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation project(':unityLibrary')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
}

tasks.configureEach { task ->
    if (task.name == "lint") {
        task.enabled = false
    }

    if (task.name.contains("Test")) {
        task.enabled = false
    }
}